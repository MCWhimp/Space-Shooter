<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Space Shooter</title>
    <style>
        body {
            margin: 0;
            background-color: #0d0d1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin: 5px 0;
            font-size: 24px;
            letter-spacing: 2px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }
        #ui {
            display: flex;
            justify-content: space-between;
            width: 800px;
            max-width: 100%;
            margin-bottom: 5px;
            font-size: 18px;
            font-weight: bold;
        }
        #score-container { color: #00ffcc; }
        #health-container { color: #ff4444; }
        canvas {
            border: 4px solid #33334d;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: radial-gradient(circle, #14142b 0%, #070714 100%);
            display: block;
        }
        #controls-hint {
            margin-top: 8px;
            color: #8888aa;
            font-size: 14px;
            text-align: center;
        }
        #game-over-screen {
            position: absolute;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(7, 7, 20, 0.85);
            border: 2px solid #ff4444;
            width: 400px;
            height: 200px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255,68,68,0.4);
        }
        #game-over-screen h2 {
            color: #ff4444;
            margin: 0 0 10px 0;
            font-size: 32px;
        }
        #restart-btn {
            background-color: #00ffcc;
            color: #070714;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #restart-btn:hover {
            background-color: #ffffff;
            box-shadow: 0 0 15px #00ffcc;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>SPACE SHOOTER</h1>
    <div id="ui">
        <div id="score-container">SCORE: <span id="score">0</span></div>
        <div id="health-container">HEALTH: <span id="health">100</span>%</div>
    </div>

    <div style="position: relative;">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="game-over-screen">
            <h2>GAME OVER</h2>
            <p id="final-score" style="margin: 0 0 20px 0; font-size: 18px;"></p>
            <button id="restart-btn" onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <div id="controls-hint">
        [← / A] Move Left &nbsp;&nbsp;&nbsp;&nbsp; [→ / D] Move Right &nbsp;&nbsp;&nbsp;&nbsp; [Spacebar] Fire Laser
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const healthEl = document.getElementById('health');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('final-score');

        // Game state
        let player = { x: 375, y: 440, width: 50, height: 40, speed: 7 };
        let lasers = [];
        let enemies = [];
        let particles = [];
        let stars = [];
        let score = 0;
        let health = 100;
        let isGameOver = false;
        let keys = {};
        let spawnInterval = 1200; // ms
        let lastSpawnTime = 0;

        // Initialize Background Stars
        for (let i = 0; i < 60; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 1.5 + 0.5
            });
        }

        // Event Listeners
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if (e.key === ' ' && !isGameOver) {
                fireLaser();
            }
        });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        function fireLaser() {
            // Center the laser relative to the player ship
            lasers.push({
                x: player.x + player.width / 2 - 3,
                y: player.y,
                width: 6,
                height: 15,
                speed: 9
            });
        }

        function spawnEnemy() {
            const size = Math.random() * 20 + 25; // size between 25 and 45
            enemies.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                speed: Math.random() * 2 + 1.5,
                color: `hsl(${Math.random() * 50 + 10}, 100%, 60%)` // Orange/Red tints
            });
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.015,
                    color: color
                });
            }
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update(timestamp) {
            if (isGameOver) return;

            // Player Movement (Arrow keys or A/D)
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.x = Math.max(0, player.x - player.speed);
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.x = Math.min(canvas.width - player.width, player.x + player.speed);
            }

            // Star Background Animation
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            // Lasers Logic
            for (let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].y -= lasers[i].speed;
                if (lasers[i].y < -lasers[i].height) {
                    lasers.splice(i, 1);
                }
            }

            // Enemy Spawning Loop
            if (timestamp - lastSpawnTime > spawnInterval) {
                spawnEnemy();
                lastSpawnTime = timestamp;
                // Gradually increase difficulty
                if (spawnInterval > 400) spawnInterval -= 15;
            }

            // Enemy Logic & Collisions
            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                enemy.y += enemy.speed;

                // Out of bounds
                if (enemy.y > canvas.height) {
                    enemies.splice(i, 1);
                    takeDamage(10);
                    continue;
                }

                // Collision with Player
                if (checkCollision(player, enemy)) {
                    createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color);
                    enemies.splice(i, 1);
                    takeDamage(20);
                    continue;
                }

                // Collision with Lasers
                for (let j = lasers.length - 1; j >= 0; j--) {
                    if (checkCollision(lasers[j], enemy)) {
                        createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color);
                        enemies.splice(i, 1);
                        lasers.splice(j, 1);
                        score += 10;
                        scoreEl.textContent = score;
                        break;
                    }
                }
            }

            // Particles Logic
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function takeDamage(amount) {
            health = Math.max(0, health - amount);
            healthEl.textContent = health;
            if (health <= 0) {
                endGame();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.globalAlpha = star.speed / 2; // Brighter stars move faster
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1.0;

            // Draw Lasers
            ctx.fillStyle = '#00ffff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffff';
            lasers.forEach(laser => {
                ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
            });

            // Draw Player Ship (Stylized Triangle Fighter)
            if (!isGameOver) {
                ctx.fillStyle = '#00ffcc';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00ffcc';
                ctx.beginPath();
                ctx.moveTo(player.x + player.width / 2, player.y); // Top Point
                ctx.lineTo(player.x + player.width, player.y + player.height); // Bottom Right
                ctx.lineTo(player.x, player.y + player.height); // Bottom Left
                ctx.closePath();
                ctx.fill();
                
                // Thruster Flame
                ctx.fillStyle = '#ff6600';
                ctx.shadowColor = '#ff6600';
                ctx.beginPath();
                ctx.moveTo(player.x + player.width / 2 - 5, player.y + player.height);
                ctx.lineTo(player.x + player.width / 2 + 5, player.y + player.height);
                ctx.lineTo(player.x + player.width / 2, player.y + player.height + 10 + Math.random()*5);
                ctx.closePath();
                ctx.fill();
            }

            // Draw Enemies (Asteroids / Alien ships)
            ctx.shadowBlur = 10;
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.shadowColor = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
            });

            // Reset shadow properties for particles
            ctx.shadowBlur = 0;

            // Draw Explosion Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        function endGame() {
            isGameOver = true;
            finalScoreEl.textContent = `FINAL SCORE: ${score}`;
            gameOverScreen.style.display = 'flex';
        }

        function resetGame() {
            player.x = 375;
            lasers = [];
            enemies = [];
            particles = [];
            score = 0;
            health = 100;
            spawnInterval = 1200;
            isGameOver = false;
            scoreEl.textContent = score;
            healthEl.textContent = health;
            gameOverScreen.style.display = 'none';
            lastSpawnTime = performance.now();
        }

        function gameLoop(timestamp) {
            update(timestamp);
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start the loop
        lastSpawnTime = performance.now();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
